[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskset-tune"
version = "0.1.0"
description = "Experimental context optimization for SurvPFN survival prediction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "torch==2.9.*",
  "scikit-survival>=0.27",
  "pandas>=2.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "matplotlib>=3.9"]
survset = ["survset>=0.2"]
finsurvival = ["pyreadr>=0.5", "pyarrow>=18"]
survpfn = ["pfns==0.3.0"]

[project.scripts]
riskset-tune = "riskset_tune.experiments.cli:main"

[tool.setuptools.packages.find]
include = ["riskset_tune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires the official SurvPFN source and checkpoint"]
