data:
  benchmark: survset
  name: auto
  min_rows: 500
  max_rows: 10000
  min_features: 2
  max_features: 10
  min_events: 10
  pca_components: null
  split:
    train_fraction: 0.6
    validation_fraction: 0.2
    query_fraction_of_train: 0.5
model:
  name: SurvPFN
  device: cpu
  precision: float32
  checkpoint_repo: samuelboehm/SurvPFN
  checkpoint_file: survpfn_nr.pt
training:
  initialization: random
  steps: 200
  batch_size: 32
  learning_rate: 0.001
  validation_every: 10
  early_stopping_patience: null
  n_time_strata: 4
  censoring_weight_floor: 0.05
  lambda_risk: 0.1
  risk_bins: 4
experiment:
  context_sizes: [64]
  seeds: [42, 43, 44]
  methods: [random, tunetables, riskset-tune]
evaluation:
  time_grid_points: 50
  lower_time_quantile: 0.1
  horizon_quantile: 0.9
