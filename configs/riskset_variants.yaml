data:
  benchmark: survset
  name: Framingham
  min_rows: 500
  max_rows: 10000
  min_features: 3
  max_features: 10
  min_events: 10
  pca_components: null
  split: {train_fraction: 0.6, validation_fraction: 0.2, query_fraction_of_train: 0.5}
model: {name: SurvPFN, device: cpu, precision: float32}
training:
  initialization: random
  batch_size: 32
  learning_rate: 0.001
  validation_every: 50
  early_stopping_patience: null
  n_time_strata: 4
  censoring_weight_floor: 0.05
  lambda_risk: 0.1
  auxiliary_strength: 0.1
  risk_bins: 4
  diagnostics_every: 100
experiment:
  datasets: [Framingham, GBSG2, LeukSurv, UnempDur, grace, uis]
  context_sizes: [32, 64]
  seeds: [42, 43]
  stage_steps: [200, 1000, 2000]
  methods: [tunetables, riskset-tune, riskset-score, riskset-listwise, random, knn, coxph_l2]
  partial_report_hours: 3
evaluation:
  time_grid_points: 50
  lower_time_quantile: 0.1
  horizon_quantile: 0.9
